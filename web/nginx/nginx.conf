# =============================================================================
# Network Manager - Nginx Production Reverse Proxy & WAF Configuration
# Multi-Layer Security: HTTPS/TLS, OWASP Defense, Rate Limiting, Security Headers
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ẩn phiên bản Nginx trong response header
    server_tokens off;

    # Định dạng log chuẩn bảo mật không lưu thông tin nhạy cảm
    log_format security_combined '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log security_combined;

    # Tối ưu hóa truyền tệp
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Giới hạn dung lượng tải lên (Chống DoS qua HTTP POST)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # =========================================================================
    # Lớp 2: Rate Limiting Zones
    # =========================================================================
    # Giới hạn API chung: 10 requests / giây
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    # Giới hạn Đăng nhập: 5 requests / phút (chống Brute-Force)
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    # Giới hạn Tải xuống phần mềm: 2 requests / giây
    limit_req_zone $binary_remote_addr zone=downloads_limit:10m rate=2r/s;

    # Trả về HTTP 429 khi vượt ngưỡng Rate Limit
    limit_req_status 429;

    # =========================================================================
    # Cụm Upstream Backend Python API
    # =========================================================================
    upstream backend_api {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # Lớp 1: Chuyển hướng HTTP sang HTTPS (Port 80 -> 443)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Chặn truy cập trực tiếp file cấu hình ẩn
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Redirect toàn bộ lưu lượng HTTP sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Máy Chủ HTTPS / TLS Chính (Port 443)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        # Chứng chỉ SSL/TLS (Tự sinh hoặc Let's Encrypt trong môi trường thật)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Giao thức TLS an toàn (Vô hiệu hóa SSLv3, TLS 1.0, TLS 1.1 cũ)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # =====================================================================
        # Lớp 8: Security Headers Bắt Buộc
        # =====================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

        # Gốc tài liệu Frontend công khai
        root /usr/share/nginx/html;
        index html/index.html index.html;

        # ---------------------------------------------------------------------
        # Chặn truy cập các thư mục/file nhạy cảm (Defense in Depth)
        # ---------------------------------------------------------------------
        location ~* ^/(config|logs|backups|\.git|\.env|.*\.db|.*\.sqlite3) {
            deny all;
            return 404;
        }

        # ---------------------------------------------------------------------
        # Phục vụ Frontend Web Tĩnh
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /html/index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # ---------------------------------------------------------------------
        # Lớp 7: Kho tải xuống tệp an toàn (Rate limited)
        # ---------------------------------------------------------------------
        location /downloads/ {
            limit_req zone=downloads_limit burst=5 nodelay;
            alias /usr/share/nginx/downloads/;
            autoindex off;
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff";
        }

        # ---------------------------------------------------------------------
        # API Xác thực (Rate limit nghiêm ngặt 5 request/phút)
        # ---------------------------------------------------------------------
        location /api/v1/auth/login {
            limit_req zone=auth_login burst=2 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ---------------------------------------------------------------------
        # API REST Chung
        # ---------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
