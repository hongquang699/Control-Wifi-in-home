version: '3.8'

services:
  # =========================================================================
  # Network Manager - Backend REST API Service
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-manager-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./docs:/app/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nm-network

  # =========================================================================
  # Network Manager - Frontend Static Showcase Web Client
  # =========================================================================
  frontend:
    image: nginx:alpine
    container_name: network-manager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./web:/usr/share/nginx/html/web:ro
      - ./frontend/public:/usr/share/nginx/html/frontend/public:ro
      - ./downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - backend
    networks:
      - nm-network

networks:
  nm-network:
    driver: bridge
