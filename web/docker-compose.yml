version: '3.8'

services:
  # =========================================================================
  # Network Manager - Backend Multi-Layer Security API Service
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-manager-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - nm-network

  # =========================================================================
  # Network Manager - Nginx WAF, Reverse Proxy & HTTPS Gateway
  # =========================================================================
  proxy:
    image: nginx:alpine
    container_name: network-manager-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html/html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - backend
    networks:
      - nm-network

networks:
  nm-network:
    driver: bridge
